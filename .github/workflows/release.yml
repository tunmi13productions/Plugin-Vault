name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # prism adds its _native folder to the package path at runtime and loads
      # prism.dll and the _prism_cffi extension from there, so PyInstaller's
      # import analysis misses them (and cffi's _cffi_backend). Without these
      # the app still runs, but screen reader announcements are silently off.
      - name: Build
        shell: pwsh
        run: |
          $pyd = python -c "import pathlib, importlib.util as u; print(pathlib.Path(u.find_spec('prism').origin).parent / '_native' / '_prism_cffi.pyd')"
          pyinstaller --noconfirm --windowed `
            --name "Plugin Vault" `
            --collect-binaries prism `
            --hidden-import _cffi_backend `
            --add-binary "$pyd;prism" `
            main.py

      # Fail the build rather than ship a release without speech
      - name: Check bundled files
        shell: pwsh
        run: |
          foreach ($f in 'prism/_native/prism.dll', 'prism/_prism_cffi.pyd') {
            if (-not (Test-Path "dist/Plugin Vault/_internal/$f")) { throw "Missing from build: $f" }
          }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE "dist/Plugin Vault/"
          Compress-Archive -Path "dist/Plugin Vault" -DestinationPath Plugin-Vault-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Plugin-Vault-windows
          path: Plugin-Vault-windows.zip

      # Only tag pushes publish a release; a manual run just leaves the artifact
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" Plugin-Vault-windows.zip
          --title "Plugin Vault ${{ github.ref_name }}"
          --generate-notes
